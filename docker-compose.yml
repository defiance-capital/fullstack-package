services:
  backend:
    build:
      context: ./backend
      target: development
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - ./backend/mysql_data:/var/lib/mysql
